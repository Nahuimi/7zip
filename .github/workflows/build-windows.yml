name: build-windows

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Visual Studio
        shell: powershell
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found."
          }
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) {
            throw "Visual Studio with C++ build tools was not found."
          }
          "VS_INSTALL=$installPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build x64
        shell: cmd
        run: |
          call "%VS_INSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          cd /d CPP\7zip
          set PLATFORM=x64
          nmake PLATFORM=%PLATFORM%

      - name: Build x86
        shell: cmd
        run: |
          call "%VS_INSTALL%\VC\Auxiliary\Build\vcvarsamd64_x86.bat"
          cd /d CPP\7zip
          set PLATFORM=x86
          nmake PLATFORM=%PLATFORM%

      - name: Pack replacement files
        shell: powershell
        run: |
          $packageRoot = Join-Path $PWD "package"
          $langRoot = Join-Path $packageRoot "Lang"
          New-Item -ItemType Directory -Force -Path $langRoot | Out-Null

          $copyMap = @(
            @{ Source = "CPP\7zip\Bundles\Fm\x64\7zFM.exe"; Destination = "7zFM.exe" },
            @{ Source = "CPP\7zip\UI\GUI\x64\7zG.exe"; Destination = "7zG.exe" },
            @{ Source = "CPP\7zip\UI\Console\x64\7z.exe"; Destination = "7z.exe" },
            @{ Source = "CPP\7zip\Bundles\Format7zF\x64\7z.dll"; Destination = "7z.dll" },
            @{ Source = "CPP\7zip\UI\Explorer\x64\7-zip.dll"; Destination = "7-zip.dll" },
            @{ Source = "CPP\7zip\UI\Explorer\x86\7-zip.dll"; Destination = "7-zip32.dll" },
            @{ Source = "CPP\7zip\Bundles\SFXWin\x64\7z.sfx"; Destination = "7z.sfx" },
            @{ Source = "CPP\7zip\Bundles\SFXCon\x64\7zCon.sfx"; Destination = "7zCon.sfx" },
            @{ Source = "Lang\en.ttt"; Destination = "Lang\en.ttt" },
            @{ Source = "Lang\zh-cn.txt"; Destination = "Lang\zh-cn.txt" }
          )

          foreach ($item in $copyMap) {
            if (-not (Test-Path $item.Source)) {
              throw "Missing expected file: $($item.Source)"
            }

            $target = Join-Path $packageRoot $item.Destination
            New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
            Copy-Item $item.Source $target -Force
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 7zip-windows-replacement
          path: package
