name: build-windows

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Visual Studio
        shell: powershell
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found."
          }
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) {
            throw "Visual Studio with C++ build tools was not found."
          }
          "VS_INSTALL=$installPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build x64
        shell: cmd
        run: |
          call "%VS_INSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          cd /d CPP\7zip
          set PLATFORM=x64
          nmake PLATFORM=%PLATFORM%

      - name: Build x86
        shell: cmd
        run: |
          call "%VS_INSTALL%\VC\Auxiliary\Build\vcvarsamd64_x86.bat"
          cd /d CPP\7zip
          set PLATFORM=x86
          nmake PLATFORM=%PLATFORM%

      - name: Pack replacement files
        shell: powershell
        run: |
          function New-ReplacementPackage {
            param(
              [string]$Platform,
              [string]$PackageRoot,
              [bool]$IncludeAltExplorer
            )

            if (Test-Path $PackageRoot) {
              Remove-Item $PackageRoot -Recurse -Force
            }

            $langRoot = Join-Path $PackageRoot "Lang"
            New-Item -ItemType Directory -Force -Path $langRoot | Out-Null
            $licenseRoot = Join-Path $PackageRoot "Licenses"
            New-Item -ItemType Directory -Force -Path $licenseRoot | Out-Null

            $copyMap = @(
              @{ Source = "CPP\7zip\UI\FileManager\$Platform\7zFM.exe"; Destination = "7zFM.exe" },
              @{ Source = "CPP\7zip\UI\GUI\$Platform\7zG.exe"; Destination = "7zG.exe" },
              @{ Source = "CPP\7zip\UI\Console\$Platform\7z.exe"; Destination = "7z.exe" },
              @{ Source = "CPP\7zip\Bundles\Format7zF\$Platform\7z.dll"; Destination = "7z.dll" },
              @{ Source = "CPP\7zip\UI\PasswordPlugin\$Platform\7zPasswordPlugins.dll"; Destination = "7zPasswordPlugins.dll" },
              @{ Source = "CPP\7zip\UI\Explorer\$Platform\7-zip.dll"; Destination = "7-zip.dll" },
              @{ Source = "CPP\7zip\Bundles\SFXWin\$Platform\7z.sfx"; Destination = "7z.sfx" },
              @{ Source = "CPP\7zip\Bundles\SFXCon\$Platform\7zCon.sfx"; Destination = "7zCon.sfx" },
              @{ Source = "Lang\en.ttt"; Destination = "Lang\en.ttt" },
              @{ Source = "Lang\zh-cn.txt"; Destination = "Lang\zh-cn.txt" },
              @{ Source = "DOC\License.txt"; Destination = "Licenses\7zip-License.txt" },
              @{ Source = "CPP\Common\CompactEncDet\LICENSE"; Destination = "Licenses\compact_enc_det-Apache-2.0.txt" },
              @{ Source = "THIRD_PARTY_NOTICES.txt"; Destination = "Licenses\THIRD_PARTY_NOTICES.txt" }
            )

            if ($IncludeAltExplorer) {
              $copyMap += @{ Source = "CPP\7zip\UI\Explorer\x86\7-zip.dll"; Destination = "7-zip32.dll" }
            }

            foreach ($item in $copyMap) {
              if (-not (Test-Path $item.Source)) {
                throw "Missing expected file: $($item.Source)"
              }

              $target = Join-Path $PackageRoot $item.Destination
              New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
              Copy-Item $item.Source $target -Force
            }
          }

          New-ReplacementPackage -Platform "x64" -PackageRoot (Join-Path $PWD "package-x64") -IncludeAltExplorer $true
          New-ReplacementPackage -Platform "x86" -PackageRoot (Join-Path $PWD "package-x86") -IncludeAltExplorer $false

      - name: Pack x86 replacement archive
        shell: powershell
        run: |
          $zipPath = Join-Path $PWD "7zip-windows-replacement-x86.zip"
          $packageRoot = Join-Path $PWD "package-x86"

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $zipPath -CompressionLevel Optimal

      - name: Pack all build products
        shell: powershell
        run: |
          $sourceRoot = (Resolve-Path "CPP\7zip").Path
          $fullPackageRoot = Join-Path $PWD "package-all"
          $zipPath = Join-Path $PWD "7zip-windows-all-products.zip"

          if (Test-Path $fullPackageRoot) {
            Remove-Item $fullPackageRoot -Recurse -Force
          }
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          New-Item -ItemType Directory -Force -Path $fullPackageRoot | Out-Null

          $productFiles = Get-ChildItem -Path $sourceRoot -Recurse -File | Where-Object {
            $_.DirectoryName -match '[\\/](x64|x86)$' -and
            @('.exe', '.dll', '.sfx') -contains $_.Extension.ToLowerInvariant()
          } | Sort-Object FullName -Unique

          if (-not $productFiles) {
            throw "No built products were found under $sourceRoot"
          }

          $sourcePrefix = $sourceRoot.TrimEnd('\') + '\'

          foreach ($file in $productFiles) {
            $relativePath = $file.FullName.Substring($sourcePrefix.Length)
            $target = Join-Path $fullPackageRoot $relativePath
            New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
            Copy-Item $file.FullName $target -Force
          }

          $langTargetRoot = Join-Path $fullPackageRoot "Lang"
          New-Item -ItemType Directory -Force -Path $langTargetRoot | Out-Null
          Copy-Item "Lang\*.txt" $langTargetRoot -Force
          Copy-Item "Lang\en.ttt" (Join-Path $langTargetRoot "en.ttt") -Force

          $licenseTargetRoot = Join-Path $fullPackageRoot "Licenses"
          New-Item -ItemType Directory -Force -Path $licenseTargetRoot | Out-Null
          Copy-Item "DOC\License.txt" (Join-Path $licenseTargetRoot "7zip-License.txt") -Force
          Copy-Item "CPP\Common\CompactEncDet\LICENSE" (Join-Path $licenseTargetRoot "compact_enc_det-Apache-2.0.txt") -Force
          Copy-Item "THIRD_PARTY_NOTICES.txt" (Join-Path $licenseTargetRoot "THIRD_PARTY_NOTICES.txt") -Force

          Compress-Archive -Path (Join-Path $fullPackageRoot '*') -DestinationPath $zipPath -CompressionLevel Optimal

      - name: Upload replacement artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7zip-windows-replacement-x64
          path: package-x64

      - name: Upload x86 replacement archive
        uses: actions/upload-artifact@v4
        with:
          name: 7zip-windows-replacement-x86
          path: 7zip-windows-replacement-x86.zip

      - name: Upload full product archive
        uses: actions/upload-artifact@v4
        with:
          name: 7zip-windows-all-products
          path: 7zip-windows-all-products.zip
